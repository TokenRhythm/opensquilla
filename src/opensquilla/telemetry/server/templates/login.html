<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenSquilla 埋点 V2 预览面板登录</title>
    <style nonce="{{ csp_nonce }}">
      body { font: 16px system-ui, sans-serif; max-width: 34rem; margin: 10vh auto; padding: 1rem; color: #172033; }
      main { border: 1px solid #ccd3df; border-radius: .75rem; padding: 1.5rem; }
      label, input, button { display: block; width: 100%; box-sizing: border-box; }
      input, button { margin-top: .5rem; padding: .75rem; }
      .error { color: #9d1c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenSquilla 埋点 V2 预览</h1>
      <p>此隔离预览仅展示稳定性与用户增长的汇总指标。</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ base_path }}/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="password">面板密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">登录</button>
      </form>
    </main>
  </body>
</html>
