# Packaged SquillaRouter tier preset. Loaded by
# opensquilla.provider.preset_registry. Curated but NOT persistable: the
# tokenrhythm id never becomes a squilla_router.tier_profile value (the
# accepted set stays pinned to the legacy nine — downgrade contract), so
# provider saves and boot defaults apply these tiers inline instead.
# No tier thinking_level on purpose: direct requests with no explicit thinking
# setting preserve the provider default, while Router auto-thinking can still
# select a per-turn level (C1 normally selects low). Exact official V4 models
# accept those controls without assigning their dialect to the other families.
[preset]
id = "tokenrhythm"
provider = "tokenrhythm"
label = "TokenRhythm"
description = "Curated TokenRhythm router ladder (Qwen3.7 Flash, DeepSeek Flash, DeepSeek V4 Pro 0813, then GLM 5.3), applied as inline tiers."
default_model = "deepseek-v4-pro-0813"

[tiers.c0]
provider = "tokenrhythm"
model = "qwen3.7-flash"
description = "Fast Qwen3.7 Flash route for trivial chat, short rewrites, extraction, low-risk simple Q&A, and lightweight coding"
supports_image = false

[tiers.c1]
provider = "tokenrhythm"
model = "deepseek-flash"
description = "Default DeepSeek Flash route for normal agent work, coding assistance, debugging, and moderate analysis"
supports_image = false

[tiers.c2]
provider = "tokenrhythm"
model = "deepseek-v4-pro-0813"
description = "Stronger DeepSeek V4 Pro 0813 route for multi-step coding, structured reasoning, larger context synthesis, and harder analysis"
supports_image = false

[tiers.c3]
provider = "tokenrhythm"
model = "glm-5.3"
description = "Highest-tier GLM 5.3 route for difficult planning, deep review, complex debugging, and high-stakes synthesis"
supports_image = false
ensemble_enabled = false

[tiers.image_model]
provider = "tokenrhythm"
model = "kimi-k2.6"
description = "Image model: vision-capable route for user-supplied image attachments, screenshots, diagrams, and visual question answering"
supports_image = true
image_only = true
