[project]
name = "opensquilla"
version = "0.5.3+metaskill"
description = "OpenSquilla runtime with executable Skill composition"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "starlette>=0.40",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.20",
    "sqlalchemy>=2.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "brotli>=1.1",
    "jinja2>=3.1",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
    "websockets>=13.0",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1",
    "html2text>=2024.2",
    "readability-lxml>=0.8",
    "beautifulsoup4>=4.12",
    "cachetools>=5.3",
    "certifi>=2024.7.4",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "croniter>=2.0",
    "tomli-w>=1.0",
    "yoyo-migrations>=8.2,<10",
    "questionary>=2.1",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "lark-oapi>=1.5.3,<2",
    "python-telegram-bot>=20.0",
    "dingtalk-stream>=0.24.3,<0.25",
    "qq-botpy>=1.2.1,<1.3",
    "cryptography>=42",
    "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
benchmark = [
    "jsonschema>=4.23", "PyMuPDF>=1.24", "requests>=2.32", "python-dotenv>=1.0",
    "numpy>=2", "scipy>=1.14", "pandas>=2.2", "matplotlib>=3.9", "seaborn>=0.13",
    "scikit-learn>=1.5", "sympy>=1.13", "defusedxml>=0.7", "lxml>=5.3",
]

[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensquilla"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/" = "opensquilla/_migrations/"

[tool.hatch.build.targets.sdist]
include = ["src/", "migrations/", "scripts/", "examples/", "tests/", "benchmark_data/", "docs/", "configs/example.toml", "configs/benchmark.example.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock"]
