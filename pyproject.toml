[project]
name = "opensquilla"
version = "0.5.4"
description = "OpenSquilla — microkernel Python agent runtime with MCP-native tools and multi-channel messaging"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "OpenSquilla contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.6.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30",
    "watchfiles>=1.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "sqlalchemy>=2.0.52",
    "anyio>=4.15.1",
    "httpx>=0.27",
    "mcp>=2.2.0,<3",
    # Security floors for HTTP and parsing dependencies used by base features.
    "aiohttp>=3.14.3",
    "idna>=3.19",
    "urllib3>=2.7.0",
    "brotli>=1.1",
    "jinja2>=3.1",
    "structlog>=26.1.0",
    # The compact help renderer adapts Typer's private Rich panel hook.
    # Review that contract before moving to another Typer minor series.
    "typer>=0.27.2,<0.28",
    "click>=8.5.0,<9",
    "rich>=13.0",
    # Lark 1.5's handshake errors are adapted per client and exercised against
    # websockets 16/17. Newer Lark SDKs require <16; review both bounds together.
    "websockets>=16.0,<18",
    "aiosqlite>=0.20",
    "apscheduler>=3.11.3",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1",
    "html2text>=2024.2",
    "readability-lxml>=0.9",
    "lxml-html-clean>=0.4.5",
    "beautifulsoup4>=4.15.0",
    "soupsieve>=2.9.2",
    "cachetools>=5.3",
    "certifi>=2026.7.22",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "croniter>=6.2.4",
    "tomli-w>=1.0",
    "yoyo-migrations>=8.2,<10",
    "sqlparse>=0.6.0",
    # >=2.1: the onboarding wizard's provider select relies on
    # ``use_search_filter`` (type-to-filter), added in questionary 2.1.
    "questionary>=2.1",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=6.18.1",
    "reportlab>=4.0.0",
    "lark-oapi>=1.5.5,<1.6",
    "python-telegram-bot>=22.8",
    "dingtalk-stream>=0.24.3,<0.25",
    "qq-botpy>=1.2.1,<1.3",
    "cryptography>=50.0.1",
    "duckduckgo-search>=8.1.1",
    "anyascii>=0.3.3",
    "snowballstemmer>=2.2",
    "slack-sdk>=3.44.1,<4",
    "discord-py>=2.7.1,<3",
    "wecom-aibot-sdk>=1.0.8,<1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.6",
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]
# Retain the documented extra name; MCP clients and server now ship in base.
mcp = []
# Optional Outlook .msg attachment extraction. Heavy transitive deps
# (oletools, msoffcrypto-tool, …), so it is opt-in; .msg uploads degrade
# gracefully with a clear message when this extra is not installed.
msg = ["extract-msg>=0.56.1"]
memory = [
    "tiktoken>=0.14.0",
    "jieba>=0.42",
]
recommended = [
    "tiktoken>=0.14.0",
    "jieba>=0.42",
    "numpy>=2.5.3",
    "lightgbm>=4.7.0",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
]
matrix = ["matrix-nio>=0.25,<0.26", "markdown>=3.10.3", "h2>=4.4.1"]
matrix-e2e = ["matrix-nio[e2e]>=0.25,<0.26", "markdown>=3.10.3", "h2>=4.4.1"]
document-extras = [
    "weasyprint>=70.0",
]

[tool.uv.dependency-groups]
desktop-build = { requires-python = ">=3.12,<3.16" }

[project.scripts]
opensquilla = "opensquilla.cli.main:app"
gateway = "opensquilla.cli.main:gateway_app"

[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
# Standard wheel/sdist builds fail closed unless the generated WebUI matches
# the current frontend source. Editable installs intentionally skip this hook.

[tool.hatch.build.targets.wheel]
packages = ["src/opensquilla"]
# Hatch normally honors .gitignore. This explicit artifact rule lets a
# verified, generated WebUI bundle enter wheels without tracking it in Git.
artifacts = ["src/opensquilla/gateway/static/dist/**"]
exclude = [
    "src/opensquilla/scheduler/templates/*.md",
    "src/opensquilla/skills/bundled/**/THIRD_PARTY_NOTICES.md",
    "src/opensquilla/skills/bundled/**/README.md",
    "src/opensquilla/skills/bundled/**/LICENSE.md",
    "src/opensquilla/skills/bundled/**/skill-card.md",
    "src/opensquilla/skills/bundled/**/references/*.md",
    "src/opensquilla/skills/exp/**",
    "src/opensquilla/skills/meta/META_SKILL_AUTHORING.md",
    # The core distribution may carry the OpenTUI JavaScript sources for
    # explicit source-development mode, but never local dependency installs or
    # compiled platform artifacts. Those belong to opensquilla-tui-host.
    "src/opensquilla/cli/tui/opentui/package/node_modules/**",
    "src/opensquilla/cli/tui/opentui/package/bin/**",
    "src/opensquilla/cli/tui/opentui/package/build/**",
    "src/opensquilla/cli/tui/opentui/package/dist/**",
]

[tool.hatch.build.targets.wheel.force-include]
"migrations/" = "opensquilla/_migrations/"
"desktop/electron/runtime/runtime-pack-catalog.json" = "opensquilla/runtime_packs/runtime-pack-catalog.json"
"src/opensquilla/skills/bundled/html-coder/references/add-css-style.md" = "opensquilla/skills/bundled/html-coder/references/add-css-style.md"
"src/opensquilla/skills/bundled/html-coder/references/add-javascript.md" = "opensquilla/skills/bundled/html-coder/references/add-javascript.md"
"src/opensquilla/skills/bundled/html-coder/references/attributes.md" = "opensquilla/skills/bundled/html-coder/references/attributes.md"
"src/opensquilla/skills/bundled/html-coder/references/essentials.md" = "opensquilla/skills/bundled/html-coder/references/essentials.md"
"src/opensquilla/skills/bundled/html-coder/references/global-attributes.md" = "opensquilla/skills/bundled/html-coder/references/global-attributes.md"
"src/opensquilla/skills/bundled/html-coder/references/glossary.md" = "opensquilla/skills/bundled/html-coder/references/glossary.md"
"src/opensquilla/skills/bundled/html-coder/references/standards.md" = "opensquilla/skills/bundled/html-coder/references/standards.md"
"src/opensquilla/skills/bundled/pptx/references/pptxgenjs.md" = "opensquilla/skills/bundled/pptx/references/pptxgenjs.md"
"src/opensquilla/skills/bundled/pptx/references/python_pptx.md" = "opensquilla/skills/bundled/pptx/references/python_pptx.md"

[tool.hatch.build.targets.sdist]
# Published sdists remain self-contained: downstream wheel builds do not need
# Node.js because release CI embeds the already-verified WebUI artifact here.
# Standard sdists deliberately reject ignored personal BGM so an ordinary
# source-archive build cannot leak private or copyrighted audio. Developers who
# need a private customized artifact can build a direct local wheel instead.
artifacts = ["src/opensquilla/gateway/static/dist/**"]

[tool.hatch.build.targets.sdist.force-include]
"desktop/electron/runtime/runtime-pack-catalog.json" = "desktop/electron/runtime/runtime-pack-catalog.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/_private", "tests/fixtures", ".omx", ".codex", ".claude"]
markers = [
    "ci_serial: tests that must run outside the parallel CI pytest worker pool",
    "llm: marks tests that make real external model/provider API calls (deselect with '-m \"not llm\"')",
    "llm_smoke: low-cost live LLM smoke tests",
    "llm_costly: slower or more expensive live model/provider tests",
    "llm_tools: live model tests that exercise tool calling",
    "llm_embedding: live embedding/vector-provider tests",
    "llm_reasoning: live reasoning-capable model tests",
    "llm_gateway: live gateway/end-to-end runtime tests",
    "llm_image: live image-generation model API tests",
    "llm_router_acc: live multi-model routing accuracy tests",
    "agent_context_boundary: agent context budget and compaction boundary tests",
    "local_golden: local opt-in synthetic complex-task golden tests",
    "webui_browser: real browser Web UI tests driven by Playwright",
    "tui_real_terminal: real terminal TUI integration tests driven through tmux or PTY",
    "live_channel: marks tests that hit a real channel platform (deselect with '-m \"not live_channel\"')",
    "live_search: marks opt-in tests that hit real search providers (deselect with '-m \"not live_search\"')",
    "live_skill_hub: marks opt-in tests that fetch a real Community Skill artifact (deselect with '-m \"not live_skill_hub\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Skill-creator template scripts: long lines carry help strings and
# example code meant to be copy-pasted verbatim; reformatting would
# harm readability. E402 imports-after-sys.path-munge is intentional.
"src/opensquilla/skills/bundled/skill-creator/scripts/*.py" = ["E501", "N806", "E402"]
"src/opensquilla/skills/bundled/skill-creator-linter/scripts/*.py" = ["E402", "I001"]
# meta-short-drama subprocess scripts: long lines hold argv arrays,
# ffmpeg filter graphs, Chinese error strings, and OpenRouter payload
# field comments meant to stay readable as one unit.
"src/opensquilla/skills/bundled/ai-video-script/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/AwesomeWebpageMetaSkill/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/nano-banana-pro/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/seedance-2-prompt/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/srt-from-script/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/subtitle-burner/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/text-file-read/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/title-card-image/scripts/*.py" = ["E501"]
"src/opensquilla/skills/bundled/video-merger/scripts/*.py" = ["E501"]
# video-merger src/ is vendored from upstream MIT-0 clawhub package; keep
# its Chinese docstrings + ffmpeg argv lines unwrapped.
"src/opensquilla/skills/bundled/video-merger/src/*.py" = ["E501", "F401"]
"src/opensquilla/skills/bundled/video-still-animator/scripts/*.py" = ["E501"]
# meta-short-drama DAG generator: template strings embed YAML blocks
# whose original line breaks must be preserved.
"scripts/_gen_meta_short_drama.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# Match the canonical full-tree type-check target used by CI on every host.
platform = "linux"
warn_return_any = true
warn_unused_configs = true
exclude = [
    "^src/opensquilla/squilla_router/models/",
    "^src/opensquilla/skills/bundled/.*/scripts/",
    # video-merger ships an upstream MIT-0 library under src/; same
    # treatment as the per-skill scripts/ trees.
    "^src/opensquilla/skills/bundled/video-merger/src/",
]

[[tool.mypy.overrides]]
module = [
    "botbuilder.*",
    "botpy.*",
    "cachetools.*",
    "dingtalk_stream.*",
    "extract_msg.*",
    "jieba",
    "nio.*",
    "numpy.*",
    "onnxruntime.*",
    "readability.*",
    "src.router.*",
    "tiktoken.*",
    "tokenizers.*",
    "websockets.*",
    "yaml.*",
    "yoyo.*",
]
ignore_missing_imports = true

[dependency-groups]
desktop-build = ["pyinstaller==6.22.3"]
wheelhouse-build = ["pip==26.2.1"]
# Frozen sessions.list types are regenerated in a separate, locked environment.
legacy-contract-codegen = ["datamodel-code-generator==0.75.1"]
dev = [
    "datamodel-code-generator==0.81.0",
    "laboratory>=1.0.2",
    "syrupy>=6.1.1",
]

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "legacy-contract-codegen" }]]
