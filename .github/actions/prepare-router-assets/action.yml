name: Prepare router assets
description: Hydrate and verify the local model bundle before Gateway startup or packaging.
runs:
  using: composite
  steps:
    - name: Hydrate and verify router assets
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        git lfs pull --include="src/opensquilla/squilla_router/models/**,src/opensquilla/squilla_router/lightgbm_model/assets/**"
        PYTHONPATH=src python -c "from opensquilla.squilla_router.lightgbm_model import validate_artifacts; print(validate_artifacts())"
