version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /opensquilla-webui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop/electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
