version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Review current and frozen generators together; security updates stay eligible.
    ignore:
      - dependency-name: datamodel-code-generator
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /opensquilla-webui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop/electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the current runtime; review Electron major migrations separately.
    # Security updates remain eligible.
    ignore:
      - dependency-name: electron
        update-types: [version-update:semver-major]
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
