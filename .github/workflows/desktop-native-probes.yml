name: Desktop Native Platform Probes
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.probe }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          probe: pty
        - os: ubuntu-latest
          probe: mcp
        - os: ubuntu-latest
          probe: frozen
        - os: macos-latest
          probe: pty
        - os: macos-latest
          probe: mcp
        - os: macos-latest
          probe: frozen
        - os: windows-latest
          probe: pty
        - os: windows-latest
          probe: mcp
        - os: windows-latest
          probe: frozen
        - os: ubuntu-latest
          probe: docker
    env:
      UV_PYTHON: '3.12'
      PYTHONPATH: ${{ github.workspace }}
      OPENSQUILLA_TURN_CALL_LOG: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: 22.12.0
    - name: Prepare native probe environment
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/desktop-native"
        printf 'CI_REPORT_DIR=%s\n' "${RUNNER_TEMP}/desktop-native" >> "${GITHUB_ENV}"
        uv sync --extra dev --extra recommended --extra mcp --frozen
    - name: Verify recommended PTY and managed execution on the native platform
      if: ${{ matrix.probe == 'pty' }}
      shell: bash
      run: |
        set -euo pipefail
        # This probe fails when the recommended backend is absent; the
        # optional-dependency skip in the core pytest suite cannot mask it.
        pty_probe_log="${CI_REPORT_DIR}/pty-capability.log"
        set +e
        uv run --no-sync python desktop/electron/scripts/gateway-entry.py --_desktop-pty-probe \
          2>&1 | tee "${pty_probe_log}"
        pty_probe_statuses=("${PIPESTATUS[@]}")
        set -e
        if [[ "${pty_probe_statuses[1]}" -ne 0 ]]; then
          exit "${pty_probe_statuses[1]}"
        fi
        if [[ "${pty_probe_statuses[0]}" -ne 0 ]]; then
          expected_pty_timeout='{"probe": "opensquilla-desktop-pty", "available": false, "ioMode": "error", "reason": "PTY probe timed out"}'
          mapfile -t pty_probe_lines < "${pty_probe_log}"
          first_pty_line="${pty_probe_lines[0]-}"
          if [[ "${RUNNER_OS}" != "Windows" ]] ||
             [[ "${#pty_probe_lines[@]}" -ne 1 ]] ||
             [[ "${first_pty_line%$'\r'}" != "${expected_pty_timeout}" ]]; then
            exit "${pty_probe_statuses[0]}"
          fi
          printf '%s\n' 'Retrying the transient Windows PTY timeout once.'
          uv run --no-sync python \
            desktop/electron/scripts/gateway-entry.py --_desktop-pty-probe \
            2>&1 | tee "${CI_REPORT_DIR}/pty-capability-attempt-2.log"
        fi
        uv run --no-sync pytest \
          tests/test_tools/test_shell_process_isolation.py::test_unified_exec_real_pty_reports_tty_and_accepts_input \
          -vv --tb=short \
          2>&1 | tee "${CI_REPORT_DIR}/pty-managed-execution.log"
    - name: Verify MCP transports and Desktop bridge on the native platform
      if: ${{ matrix.probe == 'mcp' }}
      shell: bash
      run: |
        set -euo pipefail
        uv run --no-sync pytest \
          tests/test_mcp tests/test_mcp_server \
          tests/test_desktop/test_gateway_functional_probes.py::test_gateway_fresh_profile_reaches_healthz \
          tests/test_desktop/test_gateway_functional_probes.py::test_mcp_probe_uses_real_stdio_server_and_gateway \
          -vv --tb=short \
          2>&1 | tee "${CI_REPORT_DIR}/mcp-transports.log"
    - name: Verify the frozen production MCP probe and bridge
      if: ${{ matrix.probe == 'frozen' }}
      shell: bash
      run: |
        set -euo pipefail
        uv sync --extra dev --extra recommended --extra mcp --group desktop-build --frozen
        uv run --no-sync python desktop/electron/scripts/verify-mcp-frozen.py \
          --output-dir "${CI_REPORT_DIR}/mcp-frozen" \
          2>&1 | tee "${CI_REPORT_DIR}/mcp-frozen.log"
    - name: Build production Docker image and verify MCP
      if: ${{ matrix.probe == 'docker' }}
      shell: bash
      run: |
        set -euo pipefail
        git lfs pull --include="src/opensquilla/squilla_router/models/v4.2_phase3_inference/**,src/opensquilla/squilla_router/lightgbm_model/assets/**"
        mcp_image="opensquilla-mcp-ci:${GITHUB_SHA}"
        docker build --file Dockerfile --tag "${mcp_image}" . \
          2>&1 | tee "${CI_REPORT_DIR}/mcp-docker-build.log"
        docker image inspect --format '{{json .Size}}' "${mcp_image}" \
          | tee "${CI_REPORT_DIR}/mcp-docker-size-bytes.json"
        docker run --rm -i --entrypoint python \
          --mount "type=bind,source=${GITHUB_WORKSPACE}/tests/test_mcp/fixtures,target=/mcp-fixtures,readonly" \
          "${mcp_image}" - <<'PY' 2>&1 | tee "${CI_REPORT_DIR}/mcp-docker-smoke.log"
        import asyncio
        import json
        import sys
        from importlib.metadata import requires, version

        from packaging.requirements import Requirement

        from mcp import Client
        from mcp_types import LATEST_PROTOCOL_VERSION

        from opensquilla.mcp.stdio import MCPStdioClient
        from opensquilla.mcp.types import MCPServerConfig
        from opensquilla.mcp_server import create_mcp_server

        def check_sdk_version():
            sdk_version = version("mcp")
            sdk_requirement = next(
                dependency
                for dependency in map(Requirement, requires("opensquilla") or ())
                if dependency.name == "mcp"
            )
            assert sdk_version in sdk_requirement.specifier, sdk_version
            return sdk_version

        async def check():
            sdk_version = check_sdk_version()
            async with Client(create_mcp_server(), mode="auto") as server:
                assert server.protocol_version == LATEST_PROTOCOL_VERSION
                tools = sorted(tool.name for tool in (await server.list_tools()).tools)
            assert tools == sorted([
                "conversations_list", "session_resolve", "messages_read",
                "messages_send", "events_wait", "transcript_export",
            ]), tools
            for fixture, arguments, tool in [
                ("fastmcp_server.py", [], "ping"),
                ("legacy_server.py", ["normal"], "echo"),
            ]:
                client = MCPStdioClient(MCPServerConfig(
                    name="container-probe", transport="stdio", command=sys.executable,
                    args=["-u", "/mcp-fixtures/" + fixture, *arguments],
                    tool_timeout_seconds=10,
                ))
                try:
                    await client.connect()
                    assert [item.name for item in await client.list_tools()] == [tool]
                    result = await client.call_tool(tool, {"text": "container-mcp"})
                    assert not result.is_error and result.content == "container-mcp"
                finally:
                    await client.close()
            print(json.dumps({"sdkVersion": sdk_version, "tools": tools,
                              "stdioPeers": ["modern", "legacy"]}))

        asyncio.run(asyncio.wait_for(check(), timeout=60))
        PY
    - name: Preserve native probe evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: desktop-native-${{ matrix.os }}-${{ matrix.probe }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/desktop-native/
        if-no-files-found: warn
        retention-days: 14
