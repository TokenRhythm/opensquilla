name: Temporary CSV OSS secret equality check
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      CURRENT_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      CURRENT_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      CANDIDATE_ID: ${{ secrets.CODEX_TEMP_OSS_ID_20261030 }}
      CANDIDATE_SECRET: ${{ secrets.CODEX_TEMP_OSS_SECRET_20261030 }}
    steps:
      - name: Compare CSV credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          id_match=false
          secret_match=false
          if [[ -n "${CURRENT_ID}" && "${CURRENT_ID}" == "${CANDIDATE_ID}" ]]; then
            id_match=true
          fi
          if [[ -n "${CURRENT_SECRET}" && "${CURRENT_SECRET}" == "${CANDIDATE_SECRET}" ]]; then
            secret_match=true
          fi
          echo "ACCESS_KEY_ID_MATCH=${id_match}"
          echo "ACCESS_KEY_SECRET_MATCH=${secret_match}"
          [[ "${id_match}" == true && "${secret_match}" == true ]]