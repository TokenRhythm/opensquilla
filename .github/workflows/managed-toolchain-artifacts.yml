name: Managed Toolchain Artifact E2E
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-managed-toolchain-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: Linux x64 real artifacts / paper-tex
          runner: ubuntu-24.04
          platform_key: linux-x64
          paper_platform_key: linux-x64
          component: paper-tex
        - label: Linux x64 real artifacts / media-ffmpeg
          runner: ubuntu-24.04
          platform_key: linux-x64
          paper_platform_key: linux-x64
          component: media-ffmpeg
        - label: Linux arm64 real artifacts / paper-tex
          runner: ubuntu-24.04-arm
          platform_key: linux-arm64
          paper_platform_key: linux-arm64
          component: paper-tex
        - label: Linux arm64 real artifacts / media-ffmpeg
          runner: ubuntu-24.04-arm
          platform_key: linux-arm64
          paper_platform_key: linux-arm64
          component: media-ffmpeg
        - label: macOS Apple Silicon real artifacts / paper-tex
          runner: macos-15
          platform_key: darwin-arm64
          paper_platform_key: darwin-universal
          component: paper-tex
        - label: macOS Apple Silicon real artifacts / media-ffmpeg
          runner: macos-15
          platform_key: darwin-arm64
          paper_platform_key: darwin-universal
          component: media-ffmpeg
        - label: macOS Intel real artifacts / paper-tex
          runner: macos-15-intel
          platform_key: darwin-x64
          paper_platform_key: darwin-universal
          component: paper-tex
        - label: macOS Intel real artifacts / media-ffmpeg
          runner: macos-15-intel
          platform_key: darwin-x64
          paper_platform_key: darwin-universal
          component: media-ffmpeg
        - label: Windows x64 real artifacts / paper-tex
          runner: windows-2022
          platform_key: windows-x64
          paper_platform_key: windows-x64
          component: paper-tex
        - label: Windows x64 real artifacts / media-ffmpeg
          runner: windows-2022
          platform_key: windows-x64
          paper_platform_key: windows-x64
          component: media-ffmpeg
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Configure isolated managed-toolchain state
      shell: bash
      run: |
        printf 'OPENSQUILLA_GATEWAY_STATE_DIR=%s/opensquilla-managed-toolchain-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'OPENSQUILLA_TOOLCHAIN_VALIDATION_ROOT=%s/opensquilla-managed-toolchain-state/toolchains/v1\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install runtime dependencies
      run: uv sync --frozen
    - name: Validate real pinned paper archive and capability smoke
      run: uv run --frozen python scripts/validate_managed_toolchain_artifacts.py --component paper-tex --expect-platform-key
        ${{ matrix.paper_platform_key }} ${{ matrix.platform_key == 'linux-x64' && '--check-runtime-hot-path' || '' }}
      if: ${{ matrix.component == 'paper-tex' }}
    - name: Validate real pinned media archives and capability smoke
      run: uv run --frozen python scripts/validate_managed_toolchain_artifacts.py --component media-ffmpeg --expect-platform-key
        ${{ matrix.platform_key }}
      if: ${{ matrix.component == 'media-ffmpeg' }}
  validate-musl-paper:
    name: Linux musl x64 TinyTeX real artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: python:3.12-alpine
    env:
      OPENSQUILLA_TOOLCHAIN_VALIDATION_ROOT: /tmp/opensquilla-managed-toolchains
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
    - name: Prepare Alpine action runtime
      run: apk add --no-cache fontconfig git nodejs
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Validate native musl TinyTeX archive and capability smoke
      run: python scripts/validate_managed_toolchain_artifacts_stdlib.py --component paper-tex --expect-platform-key linux-musl-x64
