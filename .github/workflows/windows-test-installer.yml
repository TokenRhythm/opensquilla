name: Windows Test Installer

# Test tags are separate from the v* tags used by Release Assets.
on:
  push:
    tags:
      - 'test-windows-*'
  workflow_dispatch:
    inputs:
      account_environment:
        description: Account/API environment embedded in the test installer
        type: choice
        default: production
        options:
          - uat
          - production
      side_by_side:
        description: Build OpenSquilla Preview with an independent installation and profile
        type: boolean
        default: false
      mirror_to_oss:
        description: Mirror ordinary test installers to public OSS (never applies to Preview)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Windows x64 test installer
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.target.outputs.artifact_name }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OPENSQUILLA_TEST_ENVIRONMENT: ${{ (inputs.account_environment == 'production' || startsWith(github.ref_name, 'test-windows-production-')) && 'production' || 'uat' }}
      OPENSQUILLA_SIDE_BY_SIDE: ${{ inputs.side_by_side && 'true' || 'false' }}
    steps:
      - name: Select test account environment
        id: target
        run: |
          $preview = $env:OPENSQUILLA_SIDE_BY_SIDE -eq 'true'
          if ($env:OPENSQUILLA_TEST_ENVIRONMENT -eq 'production') {
            'account_origin=https://tokenrhythm.studio' >> $env:GITHUB_OUTPUT
            $channel = 'production'
          } else {
            'account_origin=https://gpt.tokenrhythm.studio' >> $env:GITHUB_OUTPUT
            $channel = 'uat'
          }
          if ($preview) {
            $packageRoot = 'dist/desktop-electron/preview'
            "artifact_name=windows-$channel-preview-installer" >> $env:GITHUB_OUTPUT
            'installer_pattern=OpenSquilla-Preview-*-test-*-win-x64.exe' >> $env:GITHUB_OUTPUT
          } else {
            $packageRoot = 'dist/desktop-electron/test'
            "artifact_name=windows-$channel-test-installer" >> $env:GITHUB_OUTPUT
            'installer_pattern=OpenSquilla-*-test-*-win-x64.exe' >> $env:GITHUB_OUTPUT
          }
          if ($channel -eq 'production') { $packageRoot += '/production' }
          "package_root=$packageRoot" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Validate Preview acceptance script
        if: inputs.side_by_side
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'desktop/electron/scripts/test-preview-install-windows.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - uses: actions/setup-node@v4
        with:
          node-version-file: opensquilla-webui/.node-version
          cache: npm
          cache-dependency-path: |
            opensquilla-webui/package-lock.json
            desktop/electron/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Hydrate router assets
        run: |
          git lfs pull --include='src/opensquilla/squilla_router/models/v4.2_phase3_inference/**'
          if ($LASTEXITCODE -ne 0) { throw 'Router LFS fetch failed' }
      - name: Build and verify full Windows test package
        working-directory: desktop/electron
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Electron dependency installation failed' }
          npm run test:build-identity
          if ($LASTEXITCODE -ne 0) { throw 'Desktop identity and protocol verification failed' }
          $buildArgs = @('run', 'dist:local:test')
          $buildFlags = @()
          if ($env:OPENSQUILLA_TEST_ENVIRONMENT -eq 'production') { $buildFlags += '--production' }
          if ($env:OPENSQUILLA_SIDE_BY_SIDE -eq 'true') { $buildFlags += '--preview' }
          if ($buildFlags.Count -gt 0) { $buildArgs += @('--') + $buildFlags }
          npm @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows test packaging or verification failed' }
      - name: Verify installer size and record checksum
        run: |
          python .github/scripts/verify_desktop_slim_size.py --root '${{ steps.target.outputs.package_root }}' --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer exceeds the existing size budget' }
          $installers = @(Get-ChildItem '${{ steps.target.outputs.package_root }}' -Filter '${{ steps.target.outputs.installer_pattern }}' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows test installer' }
          $installer = $installers[0]
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding utf8
          "Windows $env:OPENSQUILLA_TEST_ENVIRONMENT test installer: $($installer.Name); source: $env:GITHUB_SHA; account/API origin: ${{ steps.target.outputs.account_origin }}; unsigned." >> $env:GITHUB_STEP_SUMMARY
      - name: Verify Preview installation remains independent from stable
        if: inputs.side_by_side
        run: |
          & ./desktop/electron/scripts/test-preview-install-windows.ps1 -PackageRoot '${{ steps.target.outputs.package_root }}'
          if ($LASTEXITCODE -ne 0) { throw 'Preview side-by-side installation verification failed' }
      - name: Upload Preview installation evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.side_by_side }}
        with:
          name: windows-preview-install-evidence
          path: ${{ runner.temp }}/opensquilla-preview-install-evidence.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact_name }}
          path: |
            ${{ steps.target.outputs.package_root }}/${{ steps.target.outputs.installer_pattern }}
            ${{ steps.target.outputs.package_root }}/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  mirror-to-oss:
    name: Mirror Windows test installer to domestic OSS
    needs: build
    if: ${{ github.repository == 'TokenRhythm/opensquilla' && !inputs.side_by_side && (github.event_name != 'workflow_dispatch' || inputs.mirror_to_oss) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: test-installer
      - name: Install pinned ossutil
        env:
          OSSUTIL_VERSION: '2.3.0'
          OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
        run: |
          set -euo pipefail
          archive="ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 180 \
            -o "${archive}" "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${archive}"
          echo "${OSSUTIL_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "${archive}"
          sudo install -m 0755 "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil
      - name: Upload, verify public downloads and prune old test installers
        env:
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX }}
          OSS_REGION: ${{ vars.ALIYUN_OSS_REGION }}
          OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT }}
          OSS_ADDRESSING_STYLE: ${{ vars.ALIYUN_OSS_ADDRESSING_STYLE }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: python3 .github/scripts/mirror-windows-test-to-oss.py test-installer
