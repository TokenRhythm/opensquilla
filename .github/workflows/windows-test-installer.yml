name: Windows Test Installer

# Test tags are separate from the v* tags used by Release Assets.
on:
  push:
    tags:
      - 'test-windows-*'
  workflow_dispatch:
    inputs:
      account_environment:
        description: 'auto: main builds UAT then production; other refs build UAT'
        type: choice
        default: auto
        options:
          - auto
          - uat
          - production

permissions:
  contents: read

jobs:
  resolve:
    name: Select test account environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      account_environment: ${{ steps.target.outputs.account_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Resolve automatic or explicit environment
        id: target
        env:
          REQUESTED_ACCOUNT_ENVIRONMENT: ${{ inputs.account_environment || 'auto' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/select_windows_test_environment.py

  build-uat:
    name: UAT build and verification
    needs: resolve
    uses: ./.github/workflows/windows-test-installer-build.yml
    with:
      account_environment: uat
    secrets:
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

  build-production:
    name: Production test installer after UAT
    needs: [resolve, build-uat]
    if: needs.resolve.outputs.account_environment == 'production'
    uses: ./.github/workflows/windows-test-installer-build.yml
    with:
      account_environment: production
    secrets:
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
