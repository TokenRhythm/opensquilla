# Dedicated internal test branch only; do not merge this workflow into main.
name: Internal signed macOS test package
'on':
  workflow_dispatch: null
cache-mode: read
permissions:
  contents: read
  actions: read
concurrency:
  group: internal-signed-macos-${{ github.run_id }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 02405876c254e28716a02c1211a200ae4ab1a630
  APPLICATION_SOURCE_SHA: 427f37b435e6faf879513a4513bc1757d629f520
  WEBUI_RUN_ID: '39433326898'
  RELEASE_PROFILE: recommended
  RELEASE_TAG: ''
jobs:
  macos-test:
    name: Build macOS Electron installer
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - name: Require the dedicated manual test branch
      shell: bash
      run: |
        set -euo pipefail
        [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
        [[ "${GITHUB_REPOSITORY}" == TokenRhythm/opensquilla ]]
        [[ "${GITHUB_REF}" == refs/heads/test/macos-signed-427f37b ]]
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true
        persist-credentials: false
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 2
    - name: Verify application and reused WebUI provenance
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]
        gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WEBUI_RUN_ID}" > "${RUNNER_TEMP}/webui-run.json"
        gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WEBUI_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/webui-jobs.json"
        python3 - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        run = json.loads((root / "webui-run.json").read_text())
        assert run["head_sha"] == os.environ["APPLICATION_SOURCE_SHA"]
        assert run["status"] == "completed"
        jobs = json.loads((root / "webui-jobs.json").read_text())["jobs"]
        matches = [job for job in jobs if job["name"] == "Build verified Web UI artifact"]
        assert len(matches) == 1 and matches[0]["conclusion"] == "success"
        changed = subprocess.check_output([
            "git", "diff", "--name-only", os.environ["APPLICATION_SOURCE_SHA"], "HEAD",
        ], text=True).splitlines()
        assert set(changed) == {
            ".github/scripts/verify_desktop_slim_size.py",
            "tests/test_scripts/test_verify_desktop_slim_size.py",
        }, changed
        print("Only fixed package size budgets and their tests differ from the signed EXE source.")
        PY
    - name: Download verified Web UI artifact
      uses: actions/download-artifact@v4
      with:
        name: opensquilla-release-webui-dist
        path: opensquilla-webui/dist/
        github-token: ${{ github.token }}
        run-id: ${{ env.WEBUI_RUN_ID }}
    - name: Hydrate router assets
      run: git lfs pull --include="src/opensquilla/squilla_router/models/**"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.12.0
        cache: npm
        cache-dependency-path: desktop/electron/package-lock.json
    - name: Stage verified Web UI artifact for Desktop
      run: node opensquilla-webui/scripts/stage-dist.mjs
    - name: Install Electron dependencies
      working-directory: desktop/electron
      run: npm ci
    - name: Verify test-package runtime-pack catalog
      if: ${{ env.RELEASE_TAG == '' }}
      working-directory: desktop/electron
      run: node ../../.github/scripts/verify-sandbox-package.mjs --source
    - name: Verify finalized runtime-pack catalog
      if: ${{ env.RELEASE_TAG != '' }}
      working-directory: desktop/electron
      run: node ../../.github/scripts/verify-sandbox-package.mjs --release-source
    - name: Build signed macOS installer
      working-directory: desktop/electron
      env:
        CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        node scripts/prepare-macos-keychain.cjs
        npm run build:gateway
        npm run build
        npm run verify:prepared
        npx electron-builder --mac --publish never --config.forceCodeSigning=true --config.dmg.sign=true
    - name: Record package sizes and contents before validation
      shell: bash
      env:
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from collections import defaultdict
        import hashlib, json, os, zipfile
        from pathlib import Path
        root = Path("dist/desktop-electron")
        files = sorted([*root.glob("*.dmg"), *root.glob("*.zip")])
        assert len(files) == 2
        assets = []
        for path in files:
            with path.open("rb") as stream:
                sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
            assets.append({"name": path.name, "bytes": path.stat().st_size, "sha256": sha256})
        zip_path = next(path for path in files if path.suffix == ".zip")
        with zipfile.ZipFile(zip_path) as archive:
            entries = [info for info in archive.infolist() if not info.is_dir()]
            totals = defaultdict(lambda: [0, 0])
            for info in entries:
                group = "/".join(info.filename.split("/")[:5])
                totals[group][0] += info.file_size
                totals[group][1] += info.compress_size
            largest = [
                {"path": info.filename, "bytes": info.file_size, "compressedBytes": info.compress_size}
                for info in sorted(entries, key=lambda item: item.compress_size, reverse=True)[:40]
            ]
        report = {
            "sourceSha": os.environ["SOURCE_SHA"],
            "applicationSourceSha": os.environ["APPLICATION_SOURCE_SHA"],
            "workflowSha": os.environ["WORKFLOW_SHA"],
            "runId": os.environ["GITHUB_RUN_ID"],
            "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "purpose": "internal signed macOS test package",
            "releaseCreated": False, "tagCreated": False,
            "assets": assets, "zipGroups": dict(totals), "largestZipEntries": largest,
        }
        (root / "test-build-info.json").write_text(json.dumps(report, indent=2) + "\n")
        (root / "SHA256SUMS").write_text("".join(
            f"{item['sha256']}  {item['name']}\n" for item in assets
        ))
        print(json.dumps(report, indent=2))
        PY
    - name: Verify Electron package
      working-directory: desktop/electron
      run: npm run verify:package
    - name: Verify macOS signatures and notarization
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apps=(dist/desktop-electron/mac*/OpenSquilla.app)
        dmgs=(dist/desktop-electron/OpenSquilla-*-mac-arm64.dmg)
        if [[ "${#apps[@]}" -ne 1 || "${#dmgs[@]}" -ne 1 ]]; then
          echo "Expected exactly one macOS app and signed DMG" >&2
          exit 1
        fi
        codesign --verify --deep --strict --verbose=2 "${apps[0]}"
        spctl --assess --type execute --verbose=2 "${apps[0]}"
        xcrun stapler validate "${apps[0]}"
        codesign --verify --strict --verbose=2 "${dmgs[0]}"
    - name: Enforce slim macOS artifact size budgets
      run: python .github/scripts/verify_desktop_slim_size.py --root dist/desktop-electron --platform macos
    - name: Smoke packaged gateway
      working-directory: desktop/electron
      env:
        OPENSQUILLA_REQUIRE_PACKAGED_GATEWAY_SMOKE: '1'
        OPENSQUILLA_GATEWAY_SMOKE_TIMEOUT_MS: '240000'
      run: npm run verify:gateway-smoke
    - name: Gate packaged first-send renderer
      working-directory: desktop/electron
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        candidates=(../../dist/desktop-electron/mac*/OpenSquilla.app/Contents/MacOS/OpenSquilla)
        if [[ "${#candidates[@]}" -ne 1 || ! -x "${candidates[0]}" ]]; then
          printf 'Expected exactly one unpacked macOS candidate, found %d\n' "${#candidates[@]}" >&2
          exit 1
        fi
        user_data="${RUNNER_TEMP}/p1-5-first-send-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "${user_data}"
        npm run test:packaged-first-send-renderer -- \
          --executable "${candidates[0]}" \
          --user-data-dir "${user_data}"
    - name: Verify v0.5.3-to-candidate macOS upgrade and uninstall preserve profile data
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        candidates=(dist/desktop-electron/OpenSquilla-*-mac-arm64.dmg)
        if [[ "${#candidates[@]}" -ne 1 || ! -f "${candidates[0]}" ]]; then
          echo "Expected exactly one candidate macOS DMG" >&2
          exit 1
        fi
        .github/scripts/verify-release-macos-upgrade.sh \
          "${candidates[0]}" built-candidate
    - name: List macOS artifacts
      run: find dist/desktop-electron -maxdepth 2 -type f -print
    - name: Upload macOS Electron artifacts
      uses: actions/upload-artifact@v4
      with:
        name: opensquilla-electron-macos
        path: |
          dist/desktop-electron/*.dmg
          dist/desktop-electron/*.zip
          dist/desktop-electron/*.blockmap
          dist/desktop-electron/latest-mac.yml

          dist/desktop-electron/SHA256SUMS
          dist/desktop-electron/test-build-info.json
        overwrite: true
        retention-days: 14
        if-no-files-found: error
    - name: Retain package inventory diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-package-inventory
        path: |-
          dist/desktop-electron/test-build-info.json
          desktop/electron/runtime/gateway/dependency-inventory.json
          desktop/electron/runtime/gateway/gateway-build.json
        if-no-files-found: warn
        retention-days: 14
