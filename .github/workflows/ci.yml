name: Storage Windows diagnostic preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-preflight:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      OPENSQUILLA_TESTING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aad23c3438458a8731f831e93b02f20233c600dd
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b6a506bf7b7b29481edf1b3097c21b3c12d4569f
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: baseline/opensquilla-webui/.node-version
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.15'
      - name: Verify source, dependencies, builds, and failed-file controls on the same runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'storage-windows-preflight'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $failed = $false
          $originalPath = $env:PATH
          foreach ($kind in @('baseline', 'candidate')) {
            Push-Location $kind
            try {
              uv sync --extra dev --extra recommended --extra mcp --frozen
              if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
              npm ci --prefix opensquilla-webui
              if ($LASTEXITCODE -ne 0) { throw 'Frontend dependencies failed' }
              npm run build --prefix opensquilla-webui
              if ($LASTEXITCODE -ne 0) { throw 'Frontend build/staging failed' }
              $env:PYTHONPATH = (Get-Location).Path + [IO.Path]::PathSeparator + (Join-Path (Get-Location).Path 'src')
              $env:PATH = (Join-Path (Get-Location).Path '.venv\Scripts') + [IO.Path]::PathSeparator + $env:PATH
              uv run python -c "import pathlib,sys,subprocess,opensquilla,json; r=pathlib.Path.cwd().resolve(); f=pathlib.Path(opensquilla.__file__).resolve(); assert r in f.parents; print(json.dumps(dict(cwd=str(r),git_root=subprocess.check_output(['git','rev-parse','--show-toplevel'],text=True).strip(),head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),python=sys.executable,package=str(f),dist=(r/'opensquilla-webui/dist').is_dir())))" 2>&1 | Tee-Object -FilePath (Join-Path $evidence "$kind-environment.log")
              if ($LASTEXITCODE -ne 0) { throw 'Source/import preflight failed' }
              $junitPath = Join-Path $evidence "$kind.xml"
              uv run pytest `
                tests/test_sandbox/test_trusted_sandbox_execution.py `
                tests/test_tools/test_approval_unification.py `
                tests/test_live_multi_provider_matrix.py `
                tests/test_live_provider_profile_smoke.py `
                tests/test_process_tree.py `
                tests/test_ci/test_windows_signed_update_audit.py `
                tests/test_engine/test_turn_error_records.py `
                tests/test_desktop/test_gateway_functional_probes.py `
                -vv --tb=short -o faulthandler_timeout=0 `
                --junitxml "$junitPath" `
                2>&1 | Tee-Object -FilePath (Join-Path $evidence "$kind-tests.log")
              $testExit = $LASTEXITCODE
              @{ kind=$kind; exit_code=$testExit } | ConvertTo-Json | Set-Content (Join-Path $evidence "$kind-result.json")
              if ($testExit -ne 0) { $failed = $true }
            } catch {
              $failed = $true
              $_ | Out-String | Set-Content (Join-Path $evidence "$kind-setup-error.log")
              Write-Output $_
            } finally {
              $env:PATH = $originalPath
              Pop-Location
              Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            }
          }
          if ($failed) { exit 1 }
      - name: Preserve every control result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-windows-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-windows-preflight/
          if-no-files-found: error
          retention-days: 30
