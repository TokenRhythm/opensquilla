  desktop-recovery-e2e:
    # Windows hosted runners can retain Chromium network resources briefly
    # after a heavy Electron test process exits.  Run the independent recovery
    # groups on fresh Windows runners so an earlier test cannot starve a later
    # one of local socket buffers. Linux and macOS retain the full serial
    # contract, which is useful for their native recovery coverage.
    name: Desktop recovery E2E (${{ matrix.os }}, ${{ matrix.shard }})
    needs: [classify-changes, frontend-check]
    if: ${{ always() && needs.classify-changes.result == 'success' && needs.frontend-check.result == 'success' && (needs.classify-changes.outputs.platform_sensitive_changed == 'true' || needs.classify-changes.outputs.desktop_changed == 'true' || needs.classify-changes.outputs.full_required == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: all
          - os: macos-latest
            shard: all
          - os: windows-latest
            shard: profiles
          - os: windows-latest
            shard: ownership
          - os: windows-latest
            shard: workbench
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env:
      UV_PYTHON: "3.12"
      PYTHONPATH: ${{ github.workspace }}
      OPENSQUILLA_TURN_CALL_LOG: "0"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Prepare Desktop recovery report
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/desktop-recovery-e2e"
          mkdir -p "${report_dir}"
          printf 'CI_REPORT_DIR=%s\n' "${report_dir}" >> "${GITHUB_ENV}"
          {
            printf 'runner_os=%s\n' "${RUNNER_OS}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
            printf 'commit_sha=%s\n' "${GITHUB_SHA}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
          } > "${report_dir}/environment.txt"
          printf 'e2e_status=not_started\n' > "${report_dir}/first-failure.txt"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: opensquilla-webui-dist
          path: src/opensquilla/gateway/static/dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: |
            desktop/electron/package-lock.json
            opensquilla-webui/package-lock.json

      - name: Verify downloaded frontend artifact on consumer OS
        shell: bash
        run: node opensquilla-webui/scripts/verify-dist.mjs src/opensquilla/gateway/static/dist

      - name: Install Python dependencies
        shell: bash
        run: uv sync --extra dev --extra recommended --extra mcp --frozen

      - name: Install Desktop dependencies
        working-directory: desktop/electron
        shell: bash
        run: npm ci

      - name: Install WebUI recovery dependencies
        working-directory: opensquilla-webui
        shell: bash
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('opensquilla-webui/package-lock.json') }}

      - name: Install WebUI recovery browser
        working-directory: opensquilla-webui
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run cross-platform production-dist browser session hang contract
        working-directory: opensquilla-webui
        shell: bash
        env:
          OPENSQUILLA_WEBUI_BASE_URL: http://127.0.0.1:18791
          OPENSQUILLA_PLAYWRIGHT_MANAGE_WEBUI: gateway
        run: |
          set -euo pipefail
          npm run test:e2e -- \
            history-hydration.spec.ts \
            --project=chromium \
            --workers=1 \
            --grep "terminates stalled" \
            2>&1 | tee "${CI_REPORT_DIR}/session-hang-recovery.log"

      - name: Record Desktop recovery tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            python --version
            uv --version
            node --version
            npm --version
          } >> "${CI_REPORT_DIR}/environment.txt" 2>&1

      - name: Build Desktop TypeScript
        working-directory: desktop/electron
        shell: bash
        run: npm run build

      - name: Run compiled Desktop recovery flows
        working-directory: desktop/electron
        shell: bash
        env:
          OPENSQUILLA_DESKTOP_CONSOLIDATION_SCREENSHOT: ${{ runner.temp }}/desktop-recovery-e2e/consolidated-primary.png
          OPENSQUILLA_DESKTOP_IMPORT_SCREENSHOT_DIR: ${{ runner.temp }}/desktop-recovery-e2e/profile-import-screenshots
        run: |
          set -euo pipefail

          run_case() {
            local name="$1"
            local script="$2"
            local attempt="$3"
            local log_path="${CI_REPORT_DIR}/${name}-attempt-${attempt}.log"
            if [[ "${RUNNER_OS}" == "Linux" ]]; then
              xvfb-run -a node "${script}" 2>&1 | tee "${log_path}"
            else
              node "${script}" 2>&1 | tee "${log_path}"
            fi
          }

          is_retryable_windows_failure() {
            local log_path="$1"
            [[ "${RUNNER_OS}" == "Windows" ]] || return 1
            grep -Fq 'Gateway did not become healthy' "${log_path}" \
              || grep -Fq 'Timed out waiting for post-exit delete-all helper completion' "${log_path}"
          }

          case "${{ matrix.shard }}" in
            all)
              entries=(
                'profile-consolidation-flow:scripts/test-profile-consolidation-flow.mjs'
                'primary-repair-accessibility:scripts/test-primary-repair-accessibility.mjs'
                'profile-import-flow:scripts/test-profile-import-flow.mjs'
                'desktop-cleanup-flow:scripts/test-desktop-cleanup-flow.mjs'
                'gateway-ownership:scripts/test-desktop-gateway-ownership.mjs'
                'gateway-orphan-recovery-flow:scripts/test-desktop-gateway-orphan-recovery-flow.mjs'
                'window-background-flow:scripts/test-desktop-window-background-flow.mjs'
                'theme-flow:scripts/test-desktop-theme-flow.mjs'
                'native-workbench-surface:scripts/test-native-workbench-surface-electron.mjs'
                'desktop-zoom-shortcuts:scripts/test-desktop-zoom-shortcuts.mjs'
                'native-workbench-v2:scripts/test-native-workbench-v2-electron.mjs'
                'unsafe-legacy-recovery-no-write:scripts/test-unsafe-legacy-recovery-no-write.mjs'
              )
              if [[ "${RUNNER_OS}" == "macOS" ]]; then
                entries+=(
                  'onboarding-flow:scripts/test-onboarding-flow.mjs'
                )
              fi
              ;;
            profiles)
              entries=(
                'onboarding-flow:scripts/test-onboarding-flow.mjs'
                'profile-consolidation-flow:scripts/test-profile-consolidation-flow.mjs'
                'primary-repair-accessibility:scripts/test-primary-repair-accessibility.mjs'
                'profile-import-flow:scripts/test-profile-import-flow.mjs'
                'desktop-cleanup-flow:scripts/test-desktop-cleanup-flow.mjs'
              )
              ;;
            ownership)
              entries=(
                'gateway-ownership:scripts/test-desktop-gateway-ownership.mjs'
                'gateway-orphan-recovery-flow:scripts/test-desktop-gateway-orphan-recovery-flow.mjs'
                'window-background-flow:scripts/test-desktop-window-background-flow.mjs'
                'theme-flow:scripts/test-desktop-theme-flow.mjs'
              )
              ;;
            workbench)
              entries=(
                'native-workbench-surface:scripts/test-native-workbench-surface-electron.mjs'
                'desktop-zoom-shortcuts:scripts/test-desktop-zoom-shortcuts.mjs'
                'native-workbench-v2:scripts/test-native-workbench-v2-electron.mjs'
                'unsafe-legacy-recovery-no-write:scripts/test-unsafe-legacy-recovery-no-write.mjs'
              )
              ;;
            *)
              echo "ERROR: unknown Desktop recovery E2E shard: ${{ matrix.shard }}" >&2
              exit 2
              ;;
          esac

          for entry in "${entries[@]}"
          do
            name="${entry%%:*}"
            script="${entry#*:}"
            if run_case "${name}" "${script}" 1; then
              continue
            fi

            first_log="${CI_REPORT_DIR}/${name}-attempt-1.log"
            printf 'failed_case=%s\n' "${name}" > "${CI_REPORT_DIR}/first-failure.txt"
            if is_retryable_windows_failure "${first_log}"
            then
              printf 'retry_case=%s\n' "${name}" >> "${CI_REPORT_DIR}/first-failure.txt"
              if run_case "${name}" "${script}" 2; then
                continue
              fi
            fi
            exit 1
          done
          printf 'e2e_status=passed\n' >> "${CI_REPORT_DIR}/first-failure.txt"

      - name: Upload Desktop recovery report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-recovery-e2e-${{ matrix.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-recovery-e2e
          if-no-files-found: error
          retention-days: 14

  release-packaging:
    name: Release packaging contracts
    needs: classify-changes
    if: ${{ always() && needs.classify-changes.result == 'success' && (needs.classify-changes.outputs.release_changed == 'true' || needs.classify-changes.outputs.full_required == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      UV_PYTHON: "3.12"
      PYTHONPATH: ${{ github.workspace }}
      OPENSQUILLA_TURN_CALL_LOG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: uv sync --extra dev --extra recommended --extra mcp --frozen

      - name: Run release packaging contract tests
        shell: bash
        run: |
          uv run pytest \
            tests/test_scripts/test_build_wheelhouse_zip.py \
            tests/test_install_scripts.py \
            tests/test_root_start_scripts.py \
            tests/test_release_consistency.py \
            tests/test_public_release_hygiene.py \
            tests/test_sandbox/test_release_contract.py \
            -q

  readme-locale-check:
    name: README locale parity
    needs: classify-changes
    if: ${{ always() && needs.classify-changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: opensquilla-webui/.node-version

      - name: Check README locale parity
        working-directory: opensquilla-webui
        run: node scripts/check-readme-locales.mjs

  managed-toolchain-artifacts:
    name: Managed Toolchain Artifact E2E
    needs: classify-changes
    if: ${{ always() && needs.classify-changes.result == 'success' && (needs.classify-changes.outputs.toolchain_artifact_changed == 'true' || needs.classify-changes.outputs.full_required == 'true') }}
    uses: ./.github/workflows/managed-toolchain-artifacts.yml

  main-canary:
    name: Main installation and offline gateway canary
    if: ${{ github.event_name == 'push' && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
      PYTHONPATH: ${{ github.workspace }}
      OPENSQUILLA_TURN_CALL_LOG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure isolated runtime directories
        shell: bash
        run: |
          printf 'OPENSQUILLA_STATE_DIR=%s/opensquilla-state\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'OPENSQUILLA_LOG_DIR=%s/opensquilla-logs\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: opensquilla-webui/.node-version
          cache: npm
          cache-dependency-path: opensquilla-webui/package-lock.json

      - name: Install locked development dependencies
        run: uv sync --extra dev --extra recommended --extra mcp --frozen

      - name: Build production WebUI artifact
        working-directory: opensquilla-webui
        run: |
          npm ci
          npm run build:artifact
          npm run verify:release-dist

      - name: Build and install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/canary-wheel"
          venv_dir="${RUNNER_TEMP}/canary-venv"
          uv build --wheel --out-dir "${wheel_dir}"
          wheels=("${wheel_dir}"/opensquilla-*.whl)
          if [[ "${#wheels[@]}" -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "ERROR: expected exactly one canary wheel" >&2
            exit 1
          fi
          uv venv "${venv_dir}" --python 3.12
          uv pip install --python "${venv_dir}/bin/python" "${wheels[0]}"
          "${venv_dir}/bin/python" -c "import opensquilla; import opensquilla.gateway.app"
          "${venv_dir}/bin/opensquilla" --help >/dev/null

      - name: Run offline gateway and provider canary
        run: >-
          uv run pytest
          tests/functional/test_gateway_silent_reply_process_e2e.py
          -q --durations=10

  ci-result:
    name: CI result
    needs:
      - queue-attestation
      - classify-changes
      - workflow-lint
      - readme-locale-check
      - frontend-check
      - webui-chat-recovery
      - tui-check
      - desktop-check
      - ubuntu-quality
      - ubuntu-full
      - windows-compat
      - windows-full
      - macos-recovery
      - desktop-recovery-e2e
      - release-packaging
      - managed-toolchain-artifacts
      - main-canary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept verified queue or main fast path
        if: >-
          ${{ (github.event_name == 'merge_group'
               && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce'
               && needs.queue-attestation.outputs.reusable == 'true')
              || (github.event_name == 'push'
                  && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce') }}
        env:
          QUEUE_RESULT: ${{ needs.queue-attestation.result }}
          QUEUE_REUSABLE: ${{ needs.queue-attestation.outputs.reusable }}
          QUEUE_REASON: ${{ needs.queue-attestation.outputs.reason }}
          MAIN_CANARY_RESULT: ${{ needs.main-canary.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            if [[ "${QUEUE_RESULT}" != "success" || "${QUEUE_REUSABLE}" != "true" ]]; then
              echo "ERROR: merge queue fast path lacks trusted green evidence: ${QUEUE_REASON}" >&2
              exit 1
            fi
            echo "Merge queue reused trusted PR CI evidence: ${QUEUE_REASON}"
          elif [[ "${MAIN_CANARY_RESULT}" != "success" ]]; then
            echo "ERROR: main canary must succeed; got ${MAIN_CANARY_RESULT:-missing}." >&2
            exit 1
          else
            echo "Main installation and offline gateway canary succeeded."
          fi

      - name: Check out repository
        if: >-
          ${{ !((github.event_name == 'merge_group'
                 && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce'
                 && needs.queue-attestation.outputs.reusable == 'true')
                || (github.event_name == 'push'
                    && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce')) }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        if: >-
          ${{ !((github.event_name == 'merge_group'
                 && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce'
                 && needs.queue-attestation.outputs.reusable == 'true')
                || (github.event_name == 'push'
                    && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce')) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WebUI chat recovery result
        if: >-
          ${{ !((github.event_name == 'merge_group'
                 && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce'
                 && needs.queue-attestation.outputs.reusable == 'true')
                || (github.event_name == 'push'
                    && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce')) }}
        env:
          RESULT_WEBUI_CHAT_RECOVERY: ${{ needs.webui-chat-recovery.result }}
          FLAG_FRONTEND_CHANGED: ${{ needs.classify-changes.outputs.frontend_changed }}
          FLAG_PLATFORM_SENSITIVE_CHANGED: ${{ needs.classify-changes.outputs.platform_sensitive_changed }}
          FLAG_FULL_REQUIRED: ${{ needs.classify-changes.outputs.full_required }}
        shell: bash
        run: |
          if [[ "${FLAG_FRONTEND_CHANGED}" == "true" || "${FLAG_PLATFORM_SENSITIVE_CHANGED}" == "true" || "${FLAG_FULL_REQUIRED}" == "true" ]]; then
            if [[ "${RESULT_WEBUI_CHAT_RECOVERY}" != "success" ]]; then
              echo "ERROR: WebUI chat recovery must succeed; got ${RESULT_WEBUI_CHAT_RECOVERY:-missing}." >&2
              exit 1
            fi
          elif [[ "${RESULT_WEBUI_CHAT_RECOVERY}" != "success" && "${RESULT_WEBUI_CHAT_RECOVERY}" != "skipped" ]]; then
            echo "ERROR: WebUI chat recovery must be successful or intentionally skipped; got ${RESULT_WEBUI_CHAT_RECOVERY:-missing}." >&2
            exit 1
          fi

      - name: Check required CI results
        if: >-
          ${{ !((github.event_name == 'merge_group'
                 && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce'
                 && needs.queue-attestation.outputs.reusable == 'true')
                || (github.event_name == 'push'
                    && (vars.CI_OPTIMIZATION_MODE || 'enforce') == 'enforce')) }}
        env:
          RESULT_CLASSIFY: ${{ needs.classify-changes.result }}
          RESULT_WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          RESULT_README_LOCALE: ${{ needs.readme-locale-check.result }}
          RESULT_FRONTEND: ${{ needs.frontend-check.result }}
          RESULT_TUI: ${{ needs.tui-check.result }}
          RESULT_DESKTOP: ${{ needs.desktop-check.result }}
          RESULT_UBUNTU: ${{ needs.ubuntu-quality.result }}
          RESULT_UBUNTU_FULL: ${{ needs.ubuntu-full.result }}
          RESULT_WINDOWS_SMOKE: ${{ needs.windows-compat.result }}
          RESULT_WINDOWS_FULL: ${{ needs.windows-full.result }}
          RESULT_MACOS_RECOVERY: ${{ needs.macos-recovery.result }}
          RESULT_DESKTOP_RECOVERY_E2E: ${{ needs.desktop-recovery-e2e.result }}
          RESULT_RELEASE: ${{ needs.release-packaging.result }}
          RESULT_MANAGED_TOOLCHAIN_ARTIFACTS: ${{ needs.managed-toolchain-artifacts.result }}
          FLAG_DOCS_ONLY: ${{ needs.classify-changes.outputs.docs_only }}
          FLAG_RUNTIME_CHANGED: ${{ needs.classify-changes.outputs.runtime_changed }}
          FLAG_TEST_CHANGED: ${{ needs.classify-changes.outputs.test_changed }}
          FLAG_CI_CHANGED: ${{ needs.classify-changes.outputs.ci_changed }}
          FLAG_DEPENDENCY_CHANGED: ${{ needs.classify-changes.outputs.dependency_changed }}
          FLAG_RELEASE_CHANGED: ${{ needs.classify-changes.outputs.release_changed }}
          FLAG_WINDOWS_FULL_REQUIRED: ${{ needs.classify-changes.outputs.windows_full_required }}
          FLAG_FRONTEND_CHANGED: ${{ needs.classify-changes.outputs.frontend_changed }}
          FLAG_TUI_CHANGED: ${{ needs.classify-changes.outputs.tui_changed }}
          FLAG_DESKTOP_CHANGED: ${{ needs.classify-changes.outputs.desktop_changed }}
          FLAG_PYTHON_CHANGED: ${{ needs.classify-changes.outputs.python_changed }}
          FLAG_PYTHON_FULL_REQUIRED: ${{ needs.classify-changes.outputs.python_full_required }}
          FLAG_PLATFORM_SENSITIVE_CHANGED: ${{ needs.classify-changes.outputs.platform_sensitive_changed }}
          FLAG_BUILD_WHEEL_REQUIRED: ${{ needs.classify-changes.outputs.build_wheel_required }}
          FLAG_TOOLCHAIN_ARTIFACT_CHANGED: ${{ needs.classify-changes.outputs.toolchain_artifact_changed }}
          FLAG_FULL_REQUIRED: ${{ needs.classify-changes.outputs.full_required }}
        run: python .github/scripts/check_ci_results.py

      - name: Create trusted PR CI attestation
        id: attestation
        if: ${{ github.event_name == 'pull_request' && env.CI_OPTIMIZATION_MODE != 'legacy' }}
        run: >-
          python .github/scripts/ci_attestation.py create
          --repository "${GITHUB_REPOSITORY}"
          --event-path "${GITHUB_EVENT_PATH}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --optimization-mode "${CI_OPTIMIZATION_MODE}"
          --output "${RUNNER_TEMP}/ci-attestation.json"
          --github-output "${GITHUB_OUTPUT}"

      - name: Upload trusted PR CI attestation
        if: ${{ github.event_name == 'pull_request' && env.CI_OPTIMIZATION_MODE != 'legacy' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-attestation-${{ steps.attestation.outputs.tree_sha }}
          path: ${{ runner.temp }}/ci-attestation.json
          if-no-files-found: error
          retention-days: 31
